<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="static/profile.css">
    <script src="static/config.js"></script>
    <script src="static/profile.js" defer></script>
</head>

<body>

    <!-- NAVIGATION BAR -->
    <header class="navbar">
        <div class="account-brand">
            <div class="account-logo" title="Account">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <span class="account-brand-text">Account</span>
        </div>

        <button id="logoutBtn" class="logout-btn" title="Logout">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Logout</span>
        </button>
    </header>

    <!-- HERO SECTION -->
    <section class="hero" id="home">

        <div class="hero-content">

            <!-- Account Logo / Avatar -->
            <div class="account-avatar-wrapper">
                <div class="account-avatar-logo">
                    <svg viewBox="0 0 24 24" width="80" height="80" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
            </div>

            <div class="hero-text">

                <p class="welcome">WELCOME</p>

                <h1>
                    Hello, <span id="userName">User</span>!
                </h1>

                <p class="hero-desc">You are successfully logged in to your account.</p>

                <div class="profile-card" style="margin-top: 20px; background: #ffffff; padding: 20px 24px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); max-width: 440px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px;">
                        <span style="color: #6b7280; font-weight: 500;">Email:</span>
                        <span id="profileEmail" style="color: #1f2937; font-weight: 600;">-</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px;">
                        <span style="color: #6b7280; font-weight: 500;">Account ID:</span>
                        <span id="profileId" style="color: #1f2937; font-weight: 600;">-</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 14px;">
                        <span style="color: #6b7280; font-weight: 500;">Backend Status:</span>
                        <span id="backendStatus" style="color: #059669; font-weight: 600;">MySQL Connected</span>
                    </div>
                </div>

            </div>

        </div>

    </section>

</body>

</html>
